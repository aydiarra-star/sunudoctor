[project]
name = "sunudoctor-backend"
version = "1.0.0"
description = "SunuDoctor API — plateforme de santé numérique (Sénégal)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "RUF"]
# B008: FastAPI's Depends()/Query() in defaults is the documented pattern.
# UP042: str+Enum is intentional for Pydantic/JSON serialisation compatibility.
ignore = ["B008", "E501", "RUF012", "B905", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Tests set env vars before importing the app, so imports follow assignment.
"tests/*" = ["B", "SIM", "RUF059", "PLR0133", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

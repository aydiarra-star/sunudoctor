<!-- === MODULE DICTÉE BILINGUE DYNAMIQUE SUNUDOCTOR === -->
<section id="demo-live" class="py-12 px-4 max-w-3xl mx-auto">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 p-6 md:p-8">
        
        <!-- En-tête du module -->
        <div class="flex items-center justify-between border-b border-slate-100 pb-4 mb-6">
            <div class="flex items-center gap-3">
                <div class="bg-blue-100 text-blue-600 p-3 rounded-xl font-bold text-xl">
                    🎙️
                </div>
                <div>
                    <h3 class="text-xl font-bold text-slate-900">Dictée Clinique Bilingue</h3>
                    <p class="text-sm text-slate-500">Français & Wolof médical</p>
                </div>
            </div>
            <span class="bg-blue-50 text-blue-700 text-xs font-semibold px-3 py-1 rounded-full border border-blue-200">
                IA SunuDoctor
            </span>
        </div>

        <!-- Contrôles Enregistrement -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
            <button id="sd-btn-record" class="w-full py-3.5 px-4 bg-red-600 hover:bg-red-700 active:bg-red-800 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
                <span class="animate-pulse">🔴</span> Commencer la Dictée
            </button>
            <button id="sd-btn-stop" class="w-full py-3.5 px-4 bg-slate-600 hover:bg-slate-700 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                <span>⏹️</span> Terminer
            </button>
        </div>

        <!-- Indicateur de statut -->
        <div id="sd-status-indicator" class="text-center text-sm font-medium text-slate-500 italic mb-6">
            Cliquez sur "Commencer la Dictée" et parlez naturellement en français et wolof.
        </div>

        <!-- Champ transcription brute (Dynamique) -->
        <div class="mb-5">
            <label for="sd-raw-text" class="block text-sm font-bold text-slate-700 mb-2">
                1. Transcription brute (Français & Wolof) :
            </label>
            <textarea id="sd-raw-text" rows="3" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Vos paroles enregistrées s'afficheront ici en temps réel..."></textarea>
        </div>

        <!-- Bouton de structuration -->
        <button id="sd-btn-format" class="w-full py-3.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition shadow-md disabled:opacity-50 disabled:cursor-not-allowed mb-6" disabled>
            ⚡ Convertir & Corriger en Fiche Médicale SOAP
        </button>

        <!-- Résultat : Fiche SOAP -->
        <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">
                2. Compte-Rendu Médical Structuré (Français Médical) :
            </label>
            <div id="sd-soap-output" contenteditable="true" class="w-full p-4 bg-emerald-50/50 border border-emerald-200 rounded-xl text-sm text-slate-800 min-h-[140px] whitespace-pre-wrap focus:outline-none">Le compte-rendu médical issu de votre propre voix s'affichera ici...</div>
        </div>
        
        <!-- Action Copier -->
        <div class="mt-4">
            <button id="sd-btn-copy" class="w-full py-3 px-4 border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl transition flex items-center justify-center gap-2">
                📋 Copier le rapport dans le dossier patient
            </button>
        </div>

    </div>
</section>

<script>
(function() {
    const LEXIQUE_MEDICAL_WOLOF = `
    - 'tàngaay' -> Hyperthermie / Fièvre
    - 'metti bopp' -> Céphalées / Maux de tête
    - 'biir buy daw' -> Diarrhée / Selles liquides
    - 'biir buy metti' -> Douleurs abdominales / Coliques
    - 'soxli' -> Toux
    - 'nokkis' -> Dyspnée / Difficulté respiratoire
    - 'lokki' -> Vomissements
    - 'xel buy waaxu' -> Nausées
    - 'yaram buy metti' -> Myalgies / Courbatures
    - 'tayel' -> Asthénie / Fatigue intense
    - 'siti' -> Hémorroïdes
    - 'sibbiru' -> Paludisme / Accès palustre
    `;

    const SYSTEM_PROMPT = `Tu es le scribe médical virtuel officiel de SunuDoctor au Sénégal.
Ta mission est de recevoir une dictée médicale brute (Français/Wolof) et d'éditer une fiche médicale SOAP professionnelle et parfaitement corrigée.
Règles :
1. Traduis le wolof en vocabulaire médical exact (ex: tàngaay = Fièvre/Hyperthermie).
2. N'ajoute AUCUNE information ou symptôme non explicitement énoncé.
3. Formate le retour au format : [S] Subjectif, [O] Objectif, [A] Analyse, [P] Plan/Traitement.`;

    let mediaRecorder;
    let audioChunks = [];

    const btnRecord = document.getElementById('sd-btn-record');
    const btnStop = document.getElementById('sd-btn-stop');
    const btnFormat = document.getElementById('sd-btn-format');
    const btnCopy = document.getElementById('sd-btn-copy');
    const statusText = document.getElementById('sd-status-indicator');
    const rawText = document.getElementById('sd-raw-text');
    const soapOutput = document.getElementById('sd-soap-output');

    btnRecord.addEventListener('click', async () => {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = event => audioChunks.push(event.data);
            mediaRecorder.onstop = handleAudioTranscription;

            mediaRecorder.start();
            btnRecord.disabled = true;
            btnStop.disabled = false;
            statusText.innerText = "🎙️ Enregistrement vocal en cours... Parlez à voix haute.";
        } catch (err) {
            alert("Erreur d'accès au microphone : " + err.message);
        }
    });

    btnStop.addEventListener('click', () => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }
        btnRecord.disabled = false;
        btnStop.disabled = true;
        statusText.innerText = "⌛ Traitement de la voix en cours...";
    });

    async function handleAudioTranscription() {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const formData = new FormData();
        formData.append('file', audioBlob, 'dictation.webm');
        formData.append('model', 'whisper-1');
        formData.append('prompt', 'Dictée médicale SunuDoctor en français et wolof: tàngaay, metti bopp, sibbiru, biir buy daw.');

        let apiKey = localStorage.getItem('SUNUDOCTOR_OPENAI_KEY');
        if (!apiKey) {
            apiKey = prompt("Veuillez saisir votre clé API OpenAI :");
            if (apiKey) {
                localStorage.setItem('SUNUDOCTOR_OPENAI_KEY', apiKey);
            } else {
                statusText.innerText = "❌ Clé API requise pour la transcription.";
                return;
            }
        }

        try {
            const response = await fetch('https://api.openai.com/v1/audio/transcriptions', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${apiKey}` },
                body: formData
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            rawText.value = data.text;
            btnFormat.disabled = false;
            statusText.innerText = "✅ Transcription audio terminée. Cliquez sur le bouton bleu pour structurer.";
        } catch (err) {
            statusText.innerText = "❌ Erreur de transcription : " + err.message;
        }
    }

    btnFormat.addEventListener('click', async () => {
        statusText.innerText = "🧠 Analyse médicale et traduction du wolof en cours...";
        
        let apiKey = localStorage.getItem('SUNUDOCTOR_OPENAI_KEY');
        if (!apiKey) {
            apiKey = prompt("Veuillez saisir votre clé API OpenAI :");
            if (apiKey) localStorage.setItem('SUNUDOCTOR_OPENAI_KEY', apiKey);
            else return;
        }

        try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: "gpt-4o",
                    temperature: 0.1,
                    messages: [
                        { role: "system", content: SYSTEM_PROMPT + "\nLexique:\n" + LEXIQUE_MEDICAL_WOLOF },
                        { role: "user", content: rawText.value }
                    ]
                })
            });

            const data = await response.json();
            if (data.error) throw new Error(data.error.message);

            soapOutput.innerText = data.choices[0].message.content;
            statusText.innerText = "✅ Compte-rendu médical généré et vérifié.";
        } catch (err) {
            statusText.innerText = "❌ Erreur d'analyse : " + err.message;
        }
    });

    btnCopy.addEventListener('click', () => {
        navigator.clipboard.writeText(soapOutput.innerText);
        alert("Compte-rendu copié dans le presse-papier !");
    });
})();
</script>
<!-- === FIN MODULE DICTÉE BILINGUE SUNUDOCTOR === -->
